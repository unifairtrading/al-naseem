name: Website build and Firebase deploy

on:
  push:
    branches:
      - rebuild/firebase-foundation
      - 'version/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Test Firestore security rules in Emulator
        run: npm test
      - name: Build website
        run: npm run build
      - name: Publish Firestore security rules
        if: ${{ github.ref == 'refs/heads/rebuild/firebase-foundation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools deploy --only firestore:rules --project al-naseem-d40c8 --non-interactive
      - name: Deploy to Firebase Hosting
        if: ${{ github.ref == 'refs/heads/rebuild/firebase-foundation' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: al-naseem-d40c8
          channelId: live
